{% extends "base.html" %}
{% block title %}Wochenplan{% endblock %}
{% block content %}
<hgroup>
  <h1>Wochenplan</h1>
  <p>Erst Entwurf, dann Tandoor. Geschrieben wird nur auf Knopfdruck.</p>
</hgroup>
{% include "woche.html" %}
{% include "plan_entwurf.html" %}
<section>
  <h2>In Tandoor</h2>
  <div id="eintraege" hx-get="/plan/eintraege?woche={{ week }}" hx-trigger="load, plan-geschrieben from:body">
    <p aria-busy="true">Frage Tandoor nach dem Plan …</p>
  </div>
</section>
{% endblock %}
