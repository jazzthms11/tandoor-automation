<li id="rezept-{{ row.id }}">
  <span class="name">{{ row.name }}</span>
  <span class="sterne" role="group" aria-label="Note für {{ row.name }}">
    {% for stars in range(1, max_stars + 1) %}
    <button type="button" hx-post="/bewertung/{{ row.id }}" hx-target="#rezept-{{ row.id }}" hx-swap="outerHTML"
            hx-vals='{"stars": {{ 0 if row.stars == stars else stars }}}'
            aria-pressed="{{ 'true' if stars <= row.stars else 'false' }}"
            title="{{ 'Note zurücknehmen' if row.stars == stars else meaning[stars] }}">★</button>
    {% endfor %}
  </span>
  {% if status %}<small class="status{% if warning %} warnung{% endif %}">{{ status }}</small>{% endif %}
</li>
