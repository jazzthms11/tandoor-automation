<form hx-post="/plan/entwurf/freigabe" hx-target="#freigabe-ergebnis" hx-swap="innerHTML show:top" hx-disabled-elt="find button">
  <input type="hidden" name="woche" value="{{ draft.week }}">
  <input type="hidden" name="version" value="{{ draft.version }}">
  {% for question in questions %}
  <fieldset class="frage">
    <legend><strong>{{ question.meal_name }} {{ question.slot[1]|tag }} bis {{ question.slot[2]|tag }}</strong>
      <small>Welches Gericht isst @leo {{ question.times }}-mal?</small></legend>
    <div class="knoepfe">
      {% for dish in question.dishes %}
      <label><input type="radio" name="lead-{{ question.slot[0] }}_{{ question.slot[1] }}_{{ question.slot[2] }}" value="{{ loop.index0 }}"{% if loop.first %} checked{% endif %}><span>{{ dish }}</span></label>
      {% endfor %}
    </div>
  </fieldset>
  {% endfor %}
  <div class="grid">
    <button type="submit" name="vorschau" value="true" class="secondary">Vorschau</button>
    <button type="submit" hx-confirm="Den Plan nach Tandoor schreiben?">Nach Tandoor schreiben</button>
  </div>
</form>
<div id="freigabe-ergebnis" aria-live="polite"></div>
