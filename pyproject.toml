[project]
name = "tandoor-automation"
version = "0.1.0"
description = "Wochenplan und Lebensmittelbestand in Tandoor automatisieren"
requires-python = "==3.13.*"
dependencies = [
    "alembic==1.20.0",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "sqlmodel==0.0.47",
]

[project.scripts]
plan = "tandoor_automation.cli:main"
bon = "tandoor_automation.bon:main"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.7",
    "ty==0.0.80",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "C90", "D", "ANN"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]

[tool.ty.rules]
possibly-missing-attribute = "error"
unresolved-import = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
